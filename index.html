<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>案件ステータス管理</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6fa;
      color: #2d3436;
      padding: 40px 20px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 28px;
      color: #1a1a2e;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      border-left: 4px solid #ccc;
      transition: box-shadow 0.2s;
    }

    .card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }

    .card.active   { border-left-color: #00b894; }
    .card.proposal { border-left-color: #fdcb6e; }
    .card.done     { border-left-color: #b2bec3; }

    .card-name {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.03em;
    }

    .badge.active   { background: #e8f8f5; color: #00b894; }
    .badge.proposal { background: #fef9e7; color: #e17e00; }
    .badge.done     { background: #f0f0f0; color: #636e72; }

    .card-updated {
      font-size: 12px;
      color: #b2bec3;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <h1>案件ステータス管理</h1>

  <div class="grid">

    <div class="card active">
      <div class="card-name">クライアントA</div>
      <span class="badge active">進行中</span>
      <div class="card-updated">更新日：2026-04-07</div>
    </div>

    <div class="card proposal">
      <div class="card-name">クライアントB</div>
      <span class="badge proposal">提案中</span>
      <div class="card-updated">更新日：2026-04-07</div>
    </div>

    <div class="card active">
      <div class="card-name">クライアントC</div>
      <span class="badge active">進行中</span>
      <div class="card-updated">更新日：2026-04-07</div>
    </div>

  </div>

</body>
</html>
